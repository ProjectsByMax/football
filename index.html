<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dumb Idiot Tracker</title>
<meta name="description" content="Max vs Michael — 2026 NFL season pick tracker. Every pick graded against the number as written.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="The Dumb Idiot Tracker">
<meta property="og:description" content="Max vs Michael — 2026 NFL season pick tracker. One of us is the dumb idiot.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8F%88</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@700;900&display=swap">
<style>
  :root {
    --ground: #EFF1F3;
    --surface: #FFFFFF;
    --surface-2: #F6F7F9;
    --ink: #14171C;
    --ink-2: #454C57;
    --muted: #737C89;
    --line: #D8DDE3;
    --line-strong: #BFC7D0;

    --max: #B4531F;
    --max-soft: #F5E4D9;
    --mike: #1B6B68;
    --mike-soft: #DCEBEA;

    --win: #2C7A4B;
    --win-soft: #DDEEE3;
    --loss: #A73226;
    --loss-soft: #F6DFDC;
    --push: #6F7783;
    --push-soft: #E6E9ED;

    --radius: 4px;
    --gutter: clamp(16px, 4vw, 40px);

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121519;
      --surface: #1A1E24;
      --surface-2: #21262E;
      --ink: #E9ECEF;
      --ink-2: #B4BCC6;
      --muted: #838C98;
      --line: #2C323B;
      --line-strong: #3D454F;

      --max: #E08A4E;
      --max-soft: #3A2515;
      --mike: #4FB3AE;
      --mike-soft: #12332F;

      --win: #5CBB84;
      --win-soft: #16301F;
      --loss: #E0705F;
      --loss-soft: #351A16;
      --push: #8B94A0;
      --push-soft: #262B33;

      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ground: #121519;
    --surface: #1A1E24;
    --surface-2: #21262E;
    --ink: #E9ECEF;
    --ink-2: #B4BCC6;
    --muted: #838C98;
    --line: #2C323B;
    --line-strong: #3D454F;

    --max: #E08A4E;
    --max-soft: #3A2515;
    --mike: #4FB3AE;
    --mike-soft: #12332F;

    --win: #5CBB84;
    --win-soft: #16301F;
    --loss: #E0705F;
    --loss-soft: #351A16;
    --push: #8B94A0;
    --push-soft: #262B33;

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-inline: var(--gutter);
    padding-block: clamp(24px, 5vw, 48px) 64px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 16px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--ink);
  }

  h1 {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 7vw, 52px);
    line-height: 0.95;
    letter-spacing: -0.005em;
    margin: 0;
    text-wrap: balance;
    text-transform: uppercase;
  }

  h1 .vs {
    color: var(--muted);
    font-weight: 500;
  }

  .masthead .sub {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-left: auto;
  }

  /* ---------- current dumb idiot readout ---------- */

  .idiot {
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #08090B;
    border: 1px solid #23262C;
    border-radius: 3px;
    padding: 8px 14px 9px;
    box-shadow: inset 0 1px 5px rgba(0, 0, 0, 0.7);
  }

  .idiot-label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: #7A4A44;
    line-height: 1;
  }

  .idiot-name {
    font-family: "Orbitron", "IBM Plex Mono", ui-monospace, monospace;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.12em;
    line-height: 1;
    color: #FF3B27;
    text-shadow:
      0 0 5px rgba(255, 59, 39, 0.9),
      0 0 16px rgba(255, 59, 39, 0.5);
    animation: idiotBlink 4s steps(1, end) infinite;
  }

  @keyframes idiotBlink {
    0%, 75%      { opacity: 1; }   /* lit for 3s of the 4s cycle */
    75.01%, 100% { opacity: 0.12; } /* dark for 1s */
  }

  /* ---------- tabs ---------- */

  .tabstrip {
    display: flex;
    gap: 0;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
    scrollbar-width: thin;
  }

  .tab {
    flex: 0 0 auto;
    appearance: none;
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 14px 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 120ms ease, border-color 120ms ease;
  }

  .tab:hover { color: var(--ink-2); }

  .tabradio {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0;
  }

  .tab { user-select: none; }

  .panel { display: none; }

  .tab.season { font-weight: 600; }

  .tab.empty { opacity: 0.45; }

  /* ---------- season: headline records ---------- */

  .standings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }

  .player {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
  }

  .player.p-max { --accent: var(--max); }
  .player.p-mike { --accent: var(--mike); }

  .player .name {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .player .figs {
    display: grid;
    grid-template-columns: auto auto;
    gap: 10px 28px;
    justify-content: start;
    align-items: end;
  }

  .player .fig-val {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(28px, 5.5vw, 40px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .player .fig-val.pct { color: var(--accent); }
  .player .fig-val.none { color: var(--muted); font-weight: 500; }

  .player .fig-key {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 7px;
  }

  .player .caption {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- breakdown ---------- */

  .section-label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .tablewrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 32px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    text-align: left;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  thead th {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface-2);
    border-bottom: 1px solid var(--line-strong);
  }

  tbody tr:last-child td { border-bottom: none; }

  td.num, th.num {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  td.cat {
    font-weight: 500;
  }

  td.dim { color: var(--muted); }

  .who {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 500;
  }

  .who::before {
    content: "";
    width: 3px;
    height: 14px;
    background: var(--accent);
    border-radius: 1px;
  }

  .who.p-max { --accent: var(--max); }
  .who.p-mike { --accent: var(--mike); }

  /* ---------- week grid on season page ---------- */

  .weekgrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px;
  }

  .wkcell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 10px;
  }

  .wkcell.blank { background: none; border-style: dashed; }

  .wkcell .wk {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .wkcell .line {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }

  .wkcell .line .v { color: var(--ink-2); }
  .wkcell .line.p-max .k { color: var(--max); }
  .wkcell .line.p-mike .k { color: var(--mike); }
  .wkcell .line .k { font-weight: 600; }
  .wkcell.blank .line { color: var(--muted); }

  /* ---------- week panels ---------- */

  .pickblock { margin-bottom: 28px; }

  .pickblock h3 {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0 0 12px;
    color: var(--accent);
  }

  .pickblock.p-max { --accent: var(--max); }
  .pickblock.p-mike { --accent: var(--mike); }

  .pickblock h3 .tally {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-left: 8px;
  }

  td.pick {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .type {
    display: inline-block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    color: var(--muted);
  }

  .badge {
    display: inline-block;
    min-width: 26px;
    text-align: center;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 2px;
  }

  .badge.w { background: var(--win-soft); color: var(--win); }
  .badge.l { background: var(--loss-soft); color: var(--loss); }
  .badge.p { background: var(--push-soft); color: var(--push); }
  .badge.pending {
    background: none;
    color: var(--muted);
    border: 1px dashed var(--line-strong);
  }

  .empty-note {
    background: var(--surface);
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .footnote {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12.5px;
    max-width: 62ch;
  }

  .footnote strong { color: var(--ink-2); font-weight: 600; }

  @media (max-width: 560px) {
    .standings { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .idiot-name { animation: none; opacity: 1; }
  }

  /* ---------- PIN gate ---------- */
  .lockbtn{align-self:center;appearance:none;background:none;border:1px solid var(--line-strong);
    border-radius:3px;color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    padding:6px 10px;margin-left:12px;cursor:pointer;white-space:nowrap}
  .lockbtn:hover{color:var(--ink);border-color:var(--ink-2)}
  .lockbtn:focus-visible{outline:2px solid var(--max);outline-offset:2px}
  #gate[hidden]{display:none !important}
  #app[hidden]{display:none !important}
  #gate{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gatecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 28px 26px;max-width:340px;width:100%;text-align:center}
  .gatecard h1{font-size:clamp(24px,6vw,31px);margin:0 0 6px}
  .gatesub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:0 0 22px}
  #pin{width:100%;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:26px;font-weight:600;
    letter-spacing:.42em;text-indent:.42em;text-align:center;padding:13px 10px;border:1px solid var(--line-strong);
    border-radius:4px;background:var(--surface-2);color:var(--ink);-webkit-appearance:none}
  #pin:focus{outline:2px solid var(--max);outline-offset:1px}
  #enter:disabled{opacity:.45;cursor:not-allowed}
  #enter{width:100%;margin-top:12px;padding:12px;border:none;border-radius:4px;background:var(--ink);
    color:var(--surface);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  #enter:hover{opacity:.88}
  #enter:focus-visible{outline:2px solid var(--max);outline-offset:2px}
  #gateerr{margin:13px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
    color:var(--loss);min-height:1.2em}
  #gatenote{margin:18px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}
  #gatebuild{margin:6px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--line-2)}

  /* ---------- CSS-only tab state (no JavaScript anywhere on this page) ---------- */
#t-season:checked ~ main #p-season { display: block; }
#t-season:checked ~ .tabstrip label[for="t-season"] { color: var(--ink); border-bottom-color: var(--ink); }

#t-wk18:checked ~ .tabstrip label[for="t-wk18"] { color: var(--ink); border-bottom-color: var(--ink); }
#t-wk18:focus-visible ~ .tabstrip label[for="t-wk18"] { outline: 2px solid var(--max); outline-offset: -2px; }
</style>
</head>
<body>

<div id="gate">
  <form class="gatecard" id="gateform" autocomplete="off" novalidate>
    <h1>The Dumb Idiot<br>Tracker</h1>
    <p class="gatesub">Enter PIN</p>
    <input id="pin" name="pin" type="text" inputmode="numeric"
           aria-label="PIN" autocomplete="off" spellcheck="false">
    <button id="enter" type="submit" disabled>Script not loaded</button>
    <p id="gateerr" role="status"></p>
    <p id="gatenote">Max vs Michael &middot; 2026 NFL season</p>
    <p id="gatebuild">build 7</p>
  </form>
  <noscript>
    <p style="max-width:340px;text-align:center;color:var(--muted)">
      This page needs JavaScript enabled to open.
    </p>
  </noscript>
</div>

<script>
(function () {
  var PIN = "42069";
  var btn = document.getElementById("enter");
  var pin = document.getElementById("pin");
  var err = document.getElementById("gateerr");
  var frm = document.getElementById("gateform");

  btn.disabled = false;
  btn.textContent = "Enter";

  function go(e) {
    if (e) { e.preventDefault(); }
    var v = String(pin.value || "").replace(/\D/g, "");
    if (v === PIN) {
      try { sessionStorage.setItem("dit", "1"); } catch (e2) {}
      location.href = "board.html";          // navigate - nothing to show or hide
    } else {
      err.textContent = v ? "Wrong PIN" : "Enter the 5-digit PIN";
      pin.value = "";
      pin.focus();
    }
    return false;
  }

  frm.addEventListener("submit", go);
  btn.addEventListener("click", go);
  pin.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.keyCode === 13) go(e);
  });
  pin.addEventListener("input", function () { err.textContent = ""; });
  pin.focus();
})();
</script>

</body>
</html>
